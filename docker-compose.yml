services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: db_dentivision
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-change-me}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://database-1.clg6gcmkex9d.us-east-2.rds.amazonaws.com:3306/db_dentivision
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:-change-me-please-use-at-least-32-characters}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      SERVER_PORT: 8080
      DDL_AUTO: update
      JPA_SHOW_SQL: "false"
      SECURITY_LOG_LEVEL: INFO
    ports:
      - "${SERVER_PORT:-8080}:8080"

volumes:
  mysql_data:
